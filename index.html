<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Зачётка</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg: var(--tg-theme-secondary-bg-color, #f2f3f7);
  --card: var(--tg-theme-section-bg-color, var(--tg-theme-bg-color, #ffffff));
  --text: var(--tg-theme-text-color, #111318);
  --hint: var(--tg-theme-hint-color, #8a8f98);
  --accent: #3b5bdb; --accent-text:#fff;
  --ok:#12b886; --bad:#fa5252; --warn:#f59f00;
  --line: rgba(128,128,128,.16); --soft: rgba(128,128,128,.09);
  --radius: 18px;
  --top: calc(var(--tg-safe-area-inset-top, 0px) + var(--tg-content-safe-area-inset-top, 0px));
  --bottom: max(env(safe-area-inset-bottom), var(--tg-safe-area-inset-bottom, 0px));
}
@media (prefers-color-scheme: dark){ :root:not(.tg){ --bg:#000; --card:#1c1c1e; --text:#f2f2f7; --hint:#8e8e93; } }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Roboto,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
body{min-height:100vh;padding:calc(10px + var(--top)) 16px calc(96px + var(--bottom))}
body.no-tabs{padding-bottom:calc(24px + var(--bottom))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,textarea,select{font:inherit;color:var(--text);-webkit-user-select:text;user-select:text}
.num{font-variant-numeric:tabular-nums}
.screen{animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.top{display:flex;justify-content:space-between;align-items:flex-end;margin:6px 2px 14px;gap:12px}
.hello{font-size:13px;color:var(--hint);margin-bottom:2px}
.title{font-size:30px;font-weight:800;letter-spacing:-.6px;line-height:1.1}
.icobtn{width:42px;height:42px;border-radius:14px;background:var(--card);display:grid;place-items:center;flex:none}
.icobtn svg{width:22px;height:22px}
.card{background:var(--card);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.card h4{margin:0 0 12px;font-size:15px;display:flex;justify-content:space-between;align-items:center}
.card h4 small{color:var(--hint);font-weight:500;font-size:13px}
.section{font-size:13px;font-weight:600;color:var(--hint);margin:18px 6px 8px;text-transform:uppercase;letter-spacing:.3px;display:flex;justify-content:space-between}
.section button{color:var(--accent);text-transform:none;letter-spacing:0;font-weight:700}
.btn{width:100%;height:52px;border-radius:15px;background:var(--accent);color:var(--accent-text);font-weight:700;font-size:16px;display:grid;place-items:center}
.btn.sec{background:var(--soft);color:var(--text)}
.btn.ghost{background:transparent;color:var(--bad);font-weight:600}
.btn:disabled{opacity:.4}
.btns{display:grid;gap:8px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tip{font-size:13px;color:var(--hint);text-align:center;line-height:1.4;margin-top:8px}
.empty{text-align:center;color:var(--hint);padding:50px 20px;font-size:15px;line-height:1.5}
.empty div{font-size:46px;margin-bottom:8px}
.pbar{height:8px;border-radius:4px;background:var(--soft);overflow:hidden}
.pbar i{display:block;height:100%;border-radius:4px;background:var(--accent);transition:width .4s}
/* Сегодня */
.hero{border-radius:22px;padding:18px;color:#fff;margin-bottom:12px;background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 55%,#7048e8));box-shadow:0 10px 26px color-mix(in srgb,var(--accent) 30%,transparent)}
.hero-top{display:flex;align-items:center;gap:14px}
.hero b.big{font-size:44px;font-weight:900;letter-spacing:-1.5px;line-height:1}
.hero small{display:block;opacity:.88;font-size:13px;margin-top:2px}
.hero .ring{margin-left:auto;position:relative;width:64px;height:64px;flex:none}
.hero .ring svg{transform:rotate(-90deg);display:block}
.hero .ring span{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;font-weight:800;text-align:center;line-height:1.1}
.hero .btn{background:#fff;color:var(--accent);margin-top:14px}
.hero .streak{display:inline-flex;gap:6px;align-items:center;background:rgba(255,255,255,.18);border-radius:10px;padding:4px 10px;font-size:13px;font-weight:700;margin-top:10px}
.exam{display:flex;align-items:center;gap:12px}
.exam > i{font-style:normal;width:50px;height:50px;border-radius:15px;display:grid;place-items:center;font-size:24px;flex:none}
.exam > div{flex:1;min-width:0}
.exam b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exam small{color:var(--hint);font-size:13px}
.exam .cnt{text-align:center;flex:none}
.exam .cnt b{font-size:24px;font-weight:900;line-height:1}
.exam .cnt small{font-size:11px}
.exam + .exam{border-top:1px solid var(--line);margin-top:12px;padding-top:12px}
.exam-go{height:34px;padding:0 12px;border-radius:11px;background:var(--accent);color:#fff;font-weight:700;font-size:13px;flex:none}
/* Колоды */
.decks{display:grid;gap:10px}
.deck{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:var(--radius);padding:13px 14px;text-align:left;width:100%}
.deck > i{font-style:normal;width:50px;height:50px;border-radius:15px;display:grid;place-items:center;font-size:24px;flex:none;font-weight:800}
.deck > div{flex:1;min-width:0}
.deck b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.deck small{color:var(--hint);font-size:13px;display:block;margin:2px 0 7px}
.deck .pbar{height:6px}
.due{flex:none;min-width:30px;height:30px;padding:0 9px;border-radius:15px;background:var(--accent);color:#fff;font-weight:800;font-size:13px;display:grid;place-items:center}
.due.zero{background:var(--soft);color:var(--hint)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:36px;padding:0 13px;border-radius:12px;background:var(--soft);font-size:14px;font-weight:600}
.chip.on{background:var(--accent);color:var(--accent-text)}
/* Колода */
.dhead{display:flex;gap:14px;align-items:center;margin:6px 2px 16px}
.dhead > i{font-style:normal;width:62px;height:62px;border-radius:19px;display:grid;place-items:center;font-size:30px;flex:none;font-weight:800}
.dhead h2{margin:0;font-size:24px;letter-spacing:-.4px;line-height:1.15}
.dhead p{margin:3px 0 0;color:var(--hint);font-size:14px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--card);border-radius:16px;padding:11px 8px;text-align:center}
.stat b{display:block;font-size:22px;font-weight:800}
.stat small{color:var(--hint);font-size:11.5px}
.modes{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.mode{background:var(--card);border-radius:16px;padding:14px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:700;font-size:14px}
.mode i{font-style:normal;font-size:26px}
.mode small{color:var(--hint);font-size:11.5px;font-weight:500}
.mode.main{grid-column:1/-1;flex-direction:row;justify-content:center;gap:10px;background:var(--accent);color:#fff;font-size:17px;padding:16px}
.mode.main small{color:rgba(255,255,255,.85);font-size:13px}
.mode:disabled{opacity:.4}
.clist{background:var(--card);border-radius:var(--radius);padding:2px 14px}
.citem{display:flex;gap:10px;align-items:center;padding:11px 0;border-top:1px solid var(--line);text-align:left;width:100%}
.citem:first-child{border-top:0}
.citem div{flex:1;min-width:0}
.citem b{display:block;font-size:15px;font-weight:600}
.citem small{display:block;color:var(--hint);font-size:13px;margin-top:2px}
.lvl{display:flex;gap:3px;flex:none}
.lvl i{width:6px;height:16px;border-radius:3px;background:var(--line)}
.lvl i.on{background:var(--ok)}
.search{width:100%;height:42px;border-radius:12px;border:0;background:var(--card);padding:0 14px;font-size:15px;margin-bottom:10px;outline:none}
/* Учёба */
.study{position:fixed;inset:0;background:var(--bg);z-index:5;display:flex;flex-direction:column;padding:calc(12px + var(--top)) 16px calc(16px + var(--bottom))}
.sbar{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.sbar .x{width:38px;height:38px;border-radius:12px;background:var(--card);font-size:16px;flex:none}
.sbar .pbar{flex:1;height:10px}
.sbar span{font-size:13px;font-weight:700;color:var(--hint);min-width:44px;text-align:right}
.deckname{text-align:center;font-size:13px;color:var(--hint);font-weight:600;margin:-4px 0 10px}
.flipwrap{flex:1;perspective:1400px;position:relative;min-height:0;touch-action:pan-y}
.flip{position:absolute;inset:0;transition:transform .5s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d}
.flip.on{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border-radius:26px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 22px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.08);overflow:auto}
.face.back{transform:rotateY(180deg)}
.face .q{font-size:27px;font-weight:700;line-height:1.3;letter-spacing:-.3px;word-break:break-word}
.face .a{font-size:24px;font-weight:700;line-height:1.35;color:var(--accent);word-break:break-word}
.face .qs{font-size:15px;color:var(--hint);margin-top:14px;line-height:1.35}
.face .ex{font-size:15px;color:var(--hint);margin-top:16px;line-height:1.4;font-style:italic}
.face .tap{position:absolute;bottom:18px;left:0;right:0;font-size:13px;color:var(--hint)}
.face .tag{position:absolute;top:16px;left:18px;font-size:12px;font-weight:700;color:var(--hint);text-transform:uppercase;letter-spacing:.5px}
.say{position:absolute;top:12px;right:12px;width:40px;height:40px;border-radius:12px;background:var(--soft);font-size:18px}
.stamp{position:absolute;top:24px;padding:6px 14px;border-radius:12px;font-weight:900;font-size:20px;border:3px solid;opacity:0;transition:opacity .1s;z-index:3;pointer-events:none}
.stamp.l{left:20px;color:var(--bad);transform:rotate(-12deg)}
.stamp.r{right:20px;color:var(--ok);transform:rotate(12deg)}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px;min-height:62px}
.grades button{border-radius:15px;padding:9px 4px;font-weight:800;font-size:14px;color:#fff;display:flex;flex-direction:column;align-items:center;gap:2px}
.grades small{font-size:11px;font-weight:600;opacity:.88}
.g0{background:var(--bad)}.g1{background:var(--warn)}.g2{background:var(--ok)}.g3{background:var(--accent)}
.showbtn{margin-top:14px}
.opts{display:grid;gap:9px;margin-top:14px}
.opt{background:var(--card);border-radius:16px;padding:15px 14px;font-size:16px;font-weight:600;text-align:left;line-height:1.3;border:2px solid transparent;transition:background .15s,border-color .15s}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--card))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--card))}
.qcard{background:var(--card);border-radius:24px;padding:26px 20px;text-align:center;flex:1;display:flex;flex-direction:column;justify-content:center;position:relative;min-height:150px}
.qcard .q{font-size:25px;font-weight:700;line-height:1.3}
.answer{width:100%;height:54px;border-radius:15px;border:2px solid var(--line);background:var(--card);padding:0 16px;font-size:18px;outline:none;margin-top:14px}
.answer.ok{border-color:var(--ok)} .answer.bad{border-color:var(--bad)}
.verdict{margin-top:10px;font-size:15px;line-height:1.4;text-align:center;min-height:21px}
.verdict b{color:var(--ok)}
.done-scr{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px}
.done-scr .big{font-size:76px}
.done-scr h2{margin:6px 0 0;font-size:28px;letter-spacing:-.5px}
.done-scr p{margin:0;color:var(--hint);font-size:15px;line-height:1.45;max-width:300px}
.res{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;margin:18px 0}
.res div{background:var(--card);border-radius:16px;padding:12px 6px}
.res b{display:block;font-size:24px;font-weight:900}
.res small{color:var(--hint);font-size:12px}
/* Прогресс */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border-radius:var(--radius);padding:14px}
.kpi b{display:block;font-size:26px;font-weight:800;letter-spacing:-.5px}
.kpi small{color:var(--hint);font-size:13px}
.chart{display:flex;align-items:flex-end;gap:5px;height:110px}
.chart div{flex:1;border-radius:6px 6px 3px 3px;background:var(--accent);min-height:3px;opacity:.9}
.chart div.z{background:var(--soft)}
.chart-x{display:flex;justify-content:space-between;color:var(--hint);font-size:11px;margin-top:6px}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,auto);grid-auto-columns:1fr;gap:3px}
.heat i{aspect-ratio:1;border-radius:3px;background:var(--soft)}
.dprog{display:flex;align-items:center;gap:10px;padding:8px 0}
.dprog + .dprog{border-top:1px solid var(--line)}
.dprog > i{font-style:normal;font-size:20px;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none}
.dprog > div{flex:1;min-width:0}
.dprog b{font-size:14px;display:flex;justify-content:space-between}
.dprog b span{color:var(--hint);font-weight:600;font-size:12px}
.dprog .pbar{margin-top:6px;height:6px}
/* Вкладки */
.tabs{position:fixed;left:12px;right:12px;bottom:calc(10px + var(--bottom));height:66px;background:var(--card);border-radius:24px;display:grid;grid-template-columns:1fr 1fr 74px 1fr 1fr;align-items:center;
  box-shadow:0 8px 30px rgba(0,0,0,.12);z-index:4;padding:0 6px}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--hint)}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--accent)}
.plus{width:58px;height:58px;border-radius:19px;background:var(--accent);color:#fff;display:grid;place-items:center;justify-self:center;margin-top:-26px;box-shadow:0 8px 20px color-mix(in srgb,var(--accent) 45%,transparent)}
.plus svg{width:28px;height:28px}
/* Лист */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:10;animation:fadebg .2s}
@keyframes fadebg{from{opacity:0}}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-radius:24px 24px 0 0;z-index:11;padding:10px 16px calc(18px + var(--bottom));
  max-height:calc(100vh - 40px - var(--top));overflow:auto;animation:up .3s cubic-bezier(.2,.9,.3,1)}
.sheet.closing{animation:down .22s ease forwards}.sheet-bg.closing{animation:fadeout .22s forwards}
@keyframes up{from{transform:translateY(100%)}}@keyframes down{to{transform:translateY(100%)}}@keyframes fadeout{to{opacity:0}}
.grab{width:38px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sheet h3{margin:0 0 14px;font-size:21px;letter-spacing:-.3px}
.label{font-size:13px;color:var(--hint);font-weight:600;margin:16px 4px 8px}
.field{width:100%;min-height:48px;border-radius:13px;border:0;background:var(--soft);padding:12px 14px;font-size:16px;outline:none;resize:none}
textarea.field{min-height:84px;line-height:1.4}
.emojis{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.emojis button{height:40px;border-radius:11px;font-size:21px}
.emojis button.on{background:var(--soft);box-shadow:inset 0 0 0 2px var(--accent)}
.colors{display:grid;grid-template-columns:repeat(8,1fr);gap:9px}
.colors button{aspect-ratio:1;border-radius:50%}
.colors button.on{box-shadow:0 0 0 3px var(--card),0 0 0 5px currentColor}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--soft);border-radius:13px;padding:3px;gap:3px}
.seg button{height:38px;border-radius:10px;font-size:14px;font-weight:600;color:var(--hint)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.setrow{display:flex;justify-content:space-between;align-items:center;padding:12px 0;font-size:15px;font-weight:500;width:100%;text-align:left}
.setrow + .setrow{border-top:1px solid var(--line)}
.switch{width:50px;height:30px;border-radius:15px;background:var(--line);position:relative;transition:background .2s;flex:none}
.switch::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch.on{background:var(--ok)}.switch.on::after{transform:translateX(20px)}
.toast{position:fixed;left:50%;bottom:calc(96px + var(--bottom));transform:translateX(-50%);background:rgba(20,20,22,.92);color:#fff;padding:11px 16px;border-radius:14px;font-size:14px;font-weight:600;z-index:60;max-width:88%;text-align:center;animation:tin .25s}
@keyframes tin{from{opacity:0;transform:translate(-50%,8px)}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}
.confetti i{position:absolute;top:-30px;font-style:normal;animation:fall 1.8s cubic-bezier(.3,.6,.6,1) forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.onb{display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:40px}
.onb .bigemoji{font-size:84px;margin-bottom:8px}
.onb h1{font-size:30px;margin:6px 0 8px;letter-spacing:-.6px}
.onb p{color:var(--hint);font-size:16px;line-height:1.45;margin:0 0 20px;max-width:330px}
.pick{display:grid;gap:8px;width:100%;text-align:left}
.pick button{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;padding:12px 14px;border:2px solid transparent}
.pick button.on{border-color:var(--accent)}
.pick i{font-style:normal;width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:21px;flex:none;font-weight:800}
.pick b{display:block;font-size:15px}.pick small{color:var(--hint);font-size:12.5px}
.pick em{margin-left:auto;font-style:normal;font-size:20px;color:var(--accent)}
.onb .pick button:not(.on) em{opacity:.18}
.fab{position:fixed;left:16px;right:16px;bottom:calc(16px + var(--bottom));z-index:4}
.preview{background:var(--soft);border-radius:13px;padding:10px 12px;font-size:13px;color:var(--hint);margin-top:8px;max-height:140px;overflow:auto;line-height:1.5}
.preview b{color:var(--text);font-weight:600}
/* ===== КР-2 учитель ===== */
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.86em;margin:0 .12em;line-height:1.15}
.fr>span:first-child{border-bottom:1.4px solid currentColor;padding:0 .18em 1px}
.fr>span:last-child{padding:1px .18em 0}
.ov{border-top:1.3px solid currentColor;padding-top:1px;margin-left:1px}
.lim{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1;margin-right:.2em}
.lim small{font-size:.58em;margin-top:2px;white-space:nowrap}
sup,sub{font-size:.68em;line-height:0}
.krcard{display:block;width:100%;text-align:left;border-radius:22px;padding:16px;margin-bottom:12px;color:#fff;
  background:linear-gradient(135deg,#e8590c,#c2255c);box-shadow:0 10px 26px rgba(194,37,92,.28)}
.krc-top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.krc-top i{font-style:normal;font-size:32px}
.krc-top div{flex:1;min-width:0}
.krc-top small{display:block;opacity:.85;font-size:12px}
.krc-top b{display:block;font-size:19px;font-weight:800}
.krc-pct{font-size:26px;font-weight:900}
.krc-sub{display:flex;justify-content:space-between;gap:8px;font-size:13px;opacity:.92;margin-top:10px}
.krc-sub span{font-weight:700;white-space:nowrap}
.krtop{display:flex;align-items:flex-end;gap:10px;margin:6px 2px 14px}
.kback{width:38px;height:38px;border-radius:12px;background:var(--card);font-size:22px;flex:none;color:var(--accent)}

.krgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}

.krhow{font-size:14px;line-height:1.5;display:grid;gap:8px}

.lt-txt{font-size:16px;line-height:1.55}
.lt-kv{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:15px;line-height:1.55}

    "Тогда |f(x)·φ(x)| ≤ c·{{ε//c + 1}} < ε.",
    "Значит lim f·φ = 0."]}],
 ["40","func","thm","Лемма об устойчивости знака для функции",
  "Если lim[x→x₀] f(x) = A > 0, то ∃Ů_{δ}(x₀): ∀x ∈ Ů_{δ}(x₀) f(x) > 0 (усиленно: f(x) ≥ c > 0). Обобщение: ∀q < A f(x) > q и ∀q > A f(x) < q в некоторой проколотой окрестности.",
  {steps:["∀ε > 0 ∃δ > 0: ∀x ∈ Ů_{δ}(x₀) A − ε < f(x) < A + ε.",
    "Простой вариант: ε = A ⇒ f(x) > 0.",
    "Усиленный: ε = {{A//2}} ⇒ f(x) > {{A//2}} = c > 0.",
    "Обобщение: для q < A берём ε = A − q, для q > A — ε = q − A."]}],
 ["42","func","thm","Отношение ограниченной функции и бесконечно большой",
  "Если f ограничена при x → x₀, а g — б.б. при x → x₀, то {{f//g}} — б.м. при x → x₀.",
  {steps:["g — б.б. ⇒ {{1//g}} — б.м. (для ε берём E = {{1//ε}}).",
    "{{f//g}} = f·{{1//g}}: ограниченная × б.м. = б.м. (теорема 36)."]}],
 ["46","func","thm","Теорема о пределе сложной функции",
  "Если 1) lim[x→x₀] f(x) = A; 2) lim[t→t₀] φ(t) = x₀; 3) в некоторой Ů(t₀) φ(t) ≠ x₀, то lim[t→t₀] f(φ(t)) = A.",
  {steps:["Пусть ε > 0. Из 1): ∃δ > 0: 0 < |x − x₀| < δ ⇒ |f(x) − A| < ε.",
    "Из 2) для этого δ: ∃η > 0: 0 < |t − t₀| < η ⇒ |φ(t) − x₀| < δ.",
    "Из 3) (уменьшив η) φ(t) ≠ x₀, значит 0 < |φ(t) − x₀| < δ.",
    "Тогда |f(φ(t)) − A| < ε — это и требовалось."]}],
 ["47","zam","thm","Первый замечательный предел",
  "lim[x→0] {{sin x//x}} = 1.",
  {idea:"Сравнить площади: треугольник < сектор < треугольник, затем «два милиционера».",
   steps:["{{sin x//x}} — чётная, поэтому достаточно x → 0+. Пусть 0 < x < {{π//2}}.",
    "Окружность радиуса R, угол AOB = x, CA ⊥ OA. S△OAB < S_{сектора OAB} < S△OAC: {{1//2}}R² sin x < {{1//2}}R² x < {{1//2}}R² tg x.",
    "Делим на {{1//2}}R² sin x > 0: 1 < {{x//sin x}} < {{1//cos x}}, т.е. cos x < {{sin x//x}} < 1.",
    "cos x → 1: из sin t < t: 0 ≤ 1 − cos x = 2 sin²{{x//2}} ≤ 2·{{x²//4}} → 0.",
    "По теореме о двух милиционерах {{sin x//x}} → 1."]}],
 ["48","zam","thm","Второй замечательный предел",
  "lim[x→∞] (1 + {{1//x}})^{x} = e, и lim[x→0] (1 + x)^{1/x} = e.",
  {steps:["Известно: lim[n→∞] (1 + {{1//n}})ⁿ = e (n ∈ ℕ).",
    "Для x > 1 найдём n: n < x < n + 1 (при x → +∞ и n → ∞).",
    "Тогда 1 + {{1//n + 1}} < 1 + {{1//x}} < 1 + {{1//n}} и (1 + {{1//n + 1}})ⁿ < (1 + {{1//x}})^{x} < (1 + {{1//n}})^{n+1}.",
    "Левая часть = {{(1 + 1/(n+1))^{n+1}//1 + 1/(n+1)}} → {{e//1}} = e; правая = (1 + {{1//n}})ⁿ·(1 + {{1//n}}) → e.",
    "По теореме о двух милиционерах (1 + {{1//x}})^{x} → e. Для x → −∞ — заменой x = −y."]}],
 ["49","zam","def","Свойства отношения эквивалентности",
  "1) рефлексивность f ~ f; 2) симметричность f ~ g ⇒ g ~ f; 3) транзитивность f ~ g, g ~ h ⇒ f ~ h.",{}],
 ["50","zam","def","Эквивалентные функции",
  "f ~ g при x → x₀, если в некоторой Ů(x₀) f(x) = λ(x)·g(x), где λ(x) → 1 (если g ≠ 0 — то {{f//g}} → 1). Свойство: если f ~ f₁, g ~ g₁, то lim {{g//f}} = lim {{g₁//f₁}} (существование одного влечёт другое).",{}],
 ["51","zam","def","o-малое",
  "f = o(g) при x → x₀, если f(x) = α(x)·g(x) в Ů(x₀), где α(x) → 0 (при g ≠ 0: {{f//g}} → 0). Свойства: o(o(g)) = o(g); o(g) ± o(g) = o(g); o(c·g) = c·o(g) = o(g); xᵐ·o(xⁿ) = o(x^{m+n}); при x → 0 o(xⁿ) + o(xᵐ) = o(x^{min(n,m)}). Равенства с o читаются слева направо.",{}],
 ["52","zam","thm","Критерий эквивалентности",
  "f ~ g при x → a ⇔ f − g = o(g) ⇔ f − g = o(f).",
  {steps:["f ~ g ⇔ f = λg, λ → 1 ⇔ f − g = (λ − 1)g, где λ − 1 → 0 ⇔ f − g = o(g).",
    "Аналогично с o(f) (по симметричности ~)."]}],
 ["53","zam","thm","Замена на эквивалентные в произведении и отношении",
  "Если f ~ g при x → a и ∃ lim h·f, то ∃ lim h·g и он такой же. Если f ~ g и ∃ lim {{h//f}}, то lim {{h//g}} = lim {{h//f}}.",
  {steps:["f ~ g ⇒ g = f·p, где p → 1.",
    "lim h·g = lim (h·f)·p = lim h·f · lim p = lim h·f.",
    "lim {{h//g}} = lim {{h//f}}·{{1//p}} = lim {{h//f}}."]}],
 ["54","zam","thm","Вывод основных эквивалентностей",
  "При α → 0: sin α ~ α, tg α ~ α, 1 − cos α ~ {{α²//2}}, arcsin α ~ α, arctg α ~ α, ln(1 + α) ~ α, e^{α} − 1 ~ α, (1 + α)ᵖ − 1 ~ pα.",
  {steps:["sin α ~ α — первый замечательный предел. tg α = {{sin α//cos α}}: {{tg α//α}} = {{sin α//α}}·{{1//cos α}} → 1.",
    "1 − cos α = 2 sin²{{α//2}} ~ 2·({{α//2}})² = {{α²//2}}.",
    "arcsin α: замена t = arcsin α, α = sin t ~ t. Аналогично arctg α ~ α (α = tg t ~ t).",
    "{{ln(1 + α)//α}} = ln(1 + α)^{1/α} → ln e = 1 (второй замечательный + непрерывность ln).",
    "e^{α} − 1: замена t = e^{α} − 1 → 0, α = ln(1 + t) ~ t.",
    "(1 + α)ᵖ − 1 = e^{p ln(1+α)} − 1 ~ p ln(1 + α) ~ pα."]}],
 ["60","nepr","def","Непрерывность функции в точке",
  "f непрерывна в x₀, если она определена в x₀ и lim[x→x₀] f(x) = f(x₀).",
  {kv:"∀ε > 0 ∃δ > 0: ∀x ∈ D(f), |x − x₀| < δ ⇒ |f(x) − f(x₀)| < ε"}],
 ["61","nepr","def","Точка разрыва и её классификация",
  "x₀ — точка разрыва, если f определена в некоторой Ů(x₀), но не непрерывна в x₀. Устранимый: односторонние пределы конечны и равны (но f(x₀) другое или не определено). I рода (скачок): односторонние пределы конечны и различны. II рода: хотя бы один односторонний предел бесконечен или не существует.",{}],
 ["63","nepr","thm","Непрерывность суммы, произведения, частного",
  "Если f, g ∈ C(x₀), то f ± g, f·g ∈ C(x₀), а при g(x₀) ≠ 0 и {{f//g}} ∈ C(x₀).",
  {steps:["lim f(x) = f(x₀), lim g(x) = g(x₀).",
    "По арифметике пределов: lim(f ± g) = f(x₀) ± g(x₀), lim f·g = f(x₀)g(x₀).",
    "При g(x₀) ≠ 0: lim {{f//g}} = {{f(x₀)//g(x₀)}} — это и есть непрерывность."]}],
 ["66","nepr","thm","Устойчивость знака для непрерывной функции",
  "Если f ∈ C(x₀) и f(x₀) > 0, то ∃U_{δ}(x₀): ∀x ∈ U_{δ}(x₀) ∩ D_{f} f(x) > 0. Следствие: f(x₀) > g(x₀) ⇒ f > g в окрестности. Усиленно: f(x) ≥ c > 0. Обобщение: ∀c < f(x₀) f ≥ c; ∀c > f(x₀) f ≤ c в окрестности.",
  {steps:["Непрерывность: ∀ε > 0 ∃δ: |x − x₀| < δ ⇒ f(x₀) − ε < f(x) < f(x₀) + ε.",
    "ε = f(x₀) ⇒ f(x) > 0; ε = {{f(x₀)//2}} ⇒ f(x) > {{f(x₀)//2}} = c.",
    "Следствие — применить к h = f − g, обобщение — ε = f(x₀) − c или c − f(x₀)."]}],
 ["70","nepr","thm","Локальная ограниченность непрерывной функции",
  "Если f ∈ C(x₀), то ∃U_{δ}(x₀), ∃C > 0: ∀x ∈ U_{δ}(x₀) ∩ D_{f} |f(x)| ≤ C.",
  {steps:["ε = 1: ∃δ: |x − x₀| < δ ⇒ |f(x) − f(x₀)| < 1.",
    "Тогда |f(x)| < |f(x₀)| + 1 = C."]}],
 ["71","nepr","thm","Непрерывность сложной функции",
  "Если g непрерывна в x₀, а f непрерывна в t₀ = g(x₀), то f(g(x)) непрерывна в x₀.",
  {steps:["f ∈ C(t₀): ∀ε > 0 ∃θ(ε): |t − t₀| < θ ⇒ |f(t) − f(t₀)| < ε.",
    "g ∈ C(x₀): для числа θ ∃δ: |x − x₀| < δ ⇒ |g(x) − g(x₀)| < θ.",
    "Тогда при |x − x₀| < δ(θ(ε)): t = g(x), |t − t₀| < θ ⇒ |f(g(x)) − f(g(x₀))| < ε.",
    "δ₁(ε) = δ(θ(ε)) подходит — сложная функция непрерывна."]}],
 ["94","nepr","def","Непрерывность на множестве и на отрезке",
  "f непрерывна на X, если непрерывна в каждой точке X. f ∈ C[a, b]: непрерывна во всех внутренних точках, справа — в a, слева — в b.",{}],
 ["73","mnozh","def","Аксиома полноты (непрерывности)",
  "Для любых непустых X, Y ⊂ ℝ таких, что ∀x ∈ X ∀y ∈ Y x ≤ y, существует c ∈ ℝ: ∀x ∈ X, ∀y ∈ Y x ≤ c ≤ y.",{}],
 ["74","mnozh","def","Ограниченное множество, границы",
  "X ограничено сверху, если ∃M: ∀x ∈ X x ≤ M (M — верхняя граница); снизу — ∃m: ∀x ∈ X x ≥ m; ограничено — ∃m, M: ∀x ∈ X m ≤ x ≤ M.",{}],
 ["75","mnozh","thm","Верхняя грань и теорема о её существовании",
  "sup X — наименьшая из верхних границ. Каждое непустое ограниченное сверху множество имеет точную верхнюю грань. Рабочее определение: M = sup X ⇔ 1) ∀x ∈ X x ≤ M; 2) ∀ε > 0 ∃x ∈ X: x > M − ε.",
  {steps:["Пусть X непусто и ограничено сверху; Y — множество всех его верхних границ (непусто).",
    "По определению ∀x ∈ X ∀y ∈ Y x ≤ y.",
    "По аксиоме полноты ∃c: ∀x ∈ X ∀y ∈ Y x ≤ c ≤ y.",
    "x ≤ c ∀x ⇒ c — верхняя граница; c ≤ y ∀y ∈ Y ⇒ c — наименьшая из них. c = sup X.",
    "(Для inf — то же с множеством нижних границ.)"]}],
 ["81","mnozh","thm","Теорема Вейерштрасса о монотонной последовательности",
  "Неубывающая ограниченная сверху последовательность сходится к sup своих значений (снизу). Невозрастающая ограниченная снизу — к inf (сверху).",
  {steps:["Пусть {xₙ} не убывает и ограничена сверху; M = sup{xₙ} существует.",
    "Рабочее определение: ∀n xₙ ≤ M и ∀ε > 0 ∃n₀: x_{n₀} > M − ε.",
    "Монотонность: ∀n ≥ n₀ xₙ ≥ x_{n₀}.",
    "Итого ∀ε > 0 ∃n₀: ∀n ≥ n₀ M − ε < x_{n₀} ≤ xₙ ≤ M — это и есть xₙ → M."]}],
 ["82","mnozh","thm","Обоснование пределов nᵏ/aⁿ и aⁿ/n!",
  "lim {{nᵏ//aⁿ}} = 0 при a > 1; lim {{aⁿ//n!}} = 0.",
  {steps:["xₙ = {{aⁿ//n!}} > 0. Отношение yₙ = {{x_{n+1}//xₙ}} = {{a//n + 1}} → 0 < 1.",
    "Значит ∃n₀: ∀n ≥ n₀ yₙ < 1, т.е. x_{n+1} < xₙ — последовательность убывает и ограничена снизу нулём.",
    "По теореме Вейерштрасса xₙ → x. Из x_{n+1} = {{a//n + 1}}·xₙ: x = 0·x = 0.",
    "Для {{nᵏ//aⁿ}} то же: отношение соседних {{(1 + 1/n)ᵏ//a}} → {{1//a}} < 1."]}],
 ["83","mnozh","thm","Сходимость последовательности (1 + 1/n)ⁿ",
  "Последовательность (1 + {{1//n}})ⁿ возрастает и ограничена сверху, поэтому по теореме Вейерштрасса сходится (к верхней грани, снизу). Предел обозначают e.",{}],
 ["84","mnozh","def","Число e",
  "e = lim[n→∞] (1 + {{1//n}})ⁿ = lim[x→0] (1 + x)^{1/x} ≈ 2,718.",{}],
 ["85","pods","def","Система стягивающихся отрезков",
  "[a₁, b₁], [a₂, b₂], … — система вложенных отрезков, если ∀n [a_{n+1}, b_{n+1}] ⊆ [aₙ, bₙ]; стягивающихся, если ещё lim (bₙ − aₙ) = 0.",{}],
 ["86","pods","thm","Лемма о стягивающихся отрезках",
  "Каждая система стягивающихся отрезков имеет общую точку, притом ровно одну. Для интервалов неверно: (0; {{1//n}}) общих точек не имеют.",
  {steps:["Для любых n ≤ m: [a_m, b_m] ⊆ [aₙ, bₙ], поэтому aₙ ≤ a_m ≤ b_m ≤ bₙ: любой левый конец ≤ любого правого.",
    "X = {aₙ}, Y = {bₙ} удовлетворяют аксиоме полноты ⇒ ∃c: ∀n aₙ ≤ c ≤ bₙ — общая точка.",
    "Пусть c′ — ещё одна общая точка. Тогда ∀n |c′ − c| ≤ bₙ − aₙ.",
    "bₙ − aₙ — б.м. Если c′ ≠ c, возьмём ε = |c′ − c|: при больших n |c′ − c| ≤ bₙ − aₙ < ε = |c′ − c| — противоречие. Значит c′ = c."]}],
 ["87","pods","def","Предельная точка последовательности",
  "c — предельная точка {aₙ}, если в любой её окрестности бесконечно много членов последовательности.",
  {kv:"∀ε > 0 ∀n₀ ∃n ≥ n₀: aₙ ∈ U_{ε}(c)"}],
 ["88","pods","def","Подпоследовательность",
  "Подпоследовательность {a_{nₖ}} получается из {aₙ} удалением части членов без изменения порядка: n₁ < n₂ < n₃ < …",{}],
 ["89","pods","thm","Подпоследовательности сходящейся последовательности",
  "Если xₙ → a, то любая её подпоследовательность сходится к тому же a.",
  {steps:["∀ε > 0 ∃N: ∀n ≥ N |xₙ − a| < ε.",
    "nₖ ≥ k (номера строго растут), поэтому при k ≥ N и nₖ ≥ N ⇒ |x_{nₖ} − a| < ε."]}],
 ["90","pods","thm","Лемма о предельной точке",
  "Каждая ограниченная последовательность имеет предельную точку. Ограниченность существенна: у aₙ = n предельных точек нет.",
  {idea:"Делим отрезок пополам, оставляя половину, где бесконечно много членов.",
   steps:["{xₙ} ограничена ⇒ все члены лежат на отрезке [a₁, b₁].",
    "Делим [a₁, b₁] пополам; хотя бы в одной половине бесконечно много членов — берём её, [a₂, b₂].",
    "Продолжаем: получаем стягивающиеся отрезки [aₙ, bₙ] (длина {{b₁ − a₁//2^{n−1}}} → 0), в каждом бесконечно много членов.",
    "По лемме о стягивающихся отрезках есть ровно одна общая точка c.",
    "Для любой U_{ε}(c): bₙ − aₙ < ε при больших n ⇒ [aₙ, bₙ] ⊂ U_{ε}(c) ⇒ в U_{ε}(c) бесконечно много членов. c — предельная точка."]}],
 ["91","pods","thm","Теорема Больцано–Вейерштрасса",
  "Из каждой ограниченной последовательности можно выделить сходящуюся подпоследовательность.",
  {steps:["По лемме о предельной точке у ограниченной последовательности есть предельная точка c.",
    "Каждая предельная точка — частичный предел: выбираем n₁ < n₂ < … с |x_{nₖ} − c| < {{1//k}}.",
    "Подпоследовательность x_{nₖ} → c."]}],
 ["92","pods","def","Фундаментальная последовательность",
  "{aₙ} фундаментальна (удовлетворяет условию Коши), если её члены с большими номерами сколь угодно близки друг к другу.",
  {kv:"∀ε > 0 ∃n₀(ε): ∀n ≥ n₀ ∀m ≥ n₀  |aₙ − a_m| < ε"}],
 ["93","pods","thm","Критерий Коши сходимости последовательности",
  "Последовательность сходится ⇔ она фундаментальна.",
  {steps:["Необходимость. Пусть aₙ → A: ∀ε > 0 ∃n₀: ∀n ≥ n₀ |aₙ − A| < {{ε//2}}.",
    "Для любого m ≥ n₀ также |a_m − A| < {{ε//2}}.",
    "|aₙ − a_m| ≤ |aₙ − A| + |A − a_m| < {{ε//2}} + {{ε//2}} = ε.",
    "(Достаточность: фундаментальная ограничена ⇒ по Больцано–Вейерштрассу есть сходящаяся подпоследовательность ⇒ вся сходится к тому же пределу.)"]}],
 ["100","pods","def","Критерий Коши для функции",
  "∃ конечный lim[x→x₀] f(x) ⇔ ∀ε > 0 ∃δ_{ε} > 0 ∀x′, x″ ∈ Ů(x₀, δ_{ε}): |f(x′) − f(x″)| < ε.",{}],
 ["95","otr","thm","Первая теорема Вейерштрасса",
  "Если f непрерывна на отрезке [a, b], то она ограничена на нём: ∃C > 0: ∀x ∈ [a, b] |f(x)| ≤ C.",
  {steps:["От противного: ∀C > 0 ∃x ∈ [a, b]: |f(x)| > C. Берём C = n — получаем xₙ ∈ [a, b], |f(xₙ)| > n: f(xₙ) — б.б.",
    "{xₙ} ограничена (лежит на [a, b]) ⇒ по Больцано–Вейерштрассу ∃x_{nₖ} → x₀.",
    "a ≤ x_{nₖ} ≤ b ⇒ по переходу к пределу в неравенствах x₀ ∈ [a, b].",
    "f(x_{nₖ}) — б.б. (подпоследовательность б.б.), но по непрерывности f(x_{nₖ}) → f(x₀) — конечный предел. Противоречие."]}],
 ["96","otr","thm","Вторая теорема Вейерштрасса",
  "Непрерывная на отрезке функция достигает на нём своих точной верхней и точной нижней граней (наибольшего и наименьшего значений).",
  {steps:["По первой теореме f ограничена ⇒ ∃M = sup f на [a, b]. Пусть f не принимает значение M: f(x) < M всюду.",

  [5,1,"Произведение функций с разрывом II рода в x₀ может быть непрерывным в x₀?","Верно: f = sin{{1//x}} + 2, g = {{1//f}} (g(0) = 1/f(0)) — произведение ≡ 1.","true"],
  [6,1,"Множество значений функции, непрерывной на отрезке, может быть интервалом?","Неверно: по теоремам Вейерштрасса — всегда отрезок.","true"],
  [7,1,"Произведение б.б. и ограниченной последовательностей может быть ограниченной?","Верно: aₙ = n, bₙ = 0.","true"],
 ]},
 { id:"42", title:"Вариант 42 (2012, 14 баллов)", tasks:[
  [1,4,"Докажите теорему о непрерывности сложной функции.","g ∈ C(x₀), f ∈ C(g(x₀)) ⇒ f(g(x)) ∈ C(x₀): для ε берём σ из непрерывности f, затем δ из непрерывности g для σ.","proof","71"],
  [3,1,"Характер точки разрыва f(x) = 2^{−1/|x − 1|}.","x = 1: −{{1//|x − 1|}} → −∞, f → 0 с обеих сторон — устранимый разрыв.","disc"],
  [4,2,"Если f непрерывна в a, то она непрерывна в некоторой окрестности a?","Неверно: x·D(x).","true"],
  [7,2,"lim[x→a+0] f(x) = A − 0 на языках окрестностей и неравенств; пример.","∀ε > 0 ∃δ > 0 ∀x ∈ (a; a + δ): A − ε < f(x) < A. Пример: f(x) = A − (x − a).","lang"],
 ]},
 { id:"92", title:"Вариант 92 (2012, 14 баллов)", tasks:[
  [7,2,"Характер точки разрыва f(x) = {{(e^{−x} − 1)/x + 1//x}}.","{{e^{−x} − 1//x}} = −1 + {{x//2}} + o(x), поэтому f = {{1//2}} + o(1) → {{1//2}} — устранимый разрыв в x = 0.","disc"],
  [6,1,"Отношение б.м. при x → 1 и ограниченной при x → 1 — б.м.?","Неверно: {{x − 1//x − 1}} = 1.","true"],
 ]},
 { id:"63", title:"Вариант 63 (2009, 12 баллов)", tasks:[
  [1,4,"Сформулируйте и докажите лемму о стягивающихся отрезках [cₙ, dₙ]. Верна ли она для интервалов?","[c_{n+1}, d_{n+1}] ⊂ [cₙ, dₙ], dₙ − cₙ → 0 ⇒ ∃! общая точка. Для интервалов неверно: ∩ (0; {{1//n}}) = ∅.","proof","86"],
  [2,3,"Сформулируйте и докажите теоремы о замене на эквивалентные при x → −∞.","Если f ~ f₁, g ~ g₁ при x → −∞, то lim fg = lim f₁g₁, lim {{f//g}} = lim {{f₁//g₁}} (существование одного влечёт другое).","proof","53"],
  [3,1,"Выведите lim[x→0] {{ln(1 + x)//x}}, не используя эквивалентности.","{{ln(1 + x)//x}} = ln(1 + x)^{1/x} → ln e = 1 (второй замечательный предел и непрерывность логарифма).","proof"],
  [4,2,"lim[x→a+0] f(x) = +∞ на языках окрестностей и неравенств; пример.","∀E > 0 ∃δ > 0 ∀x ∈ (a; a + δ): f(x) > E. Пример: {{1//x − a}}.","lang"],
  [5,1,"Определение ограниченности функции в интервале (0, 1) в кванторах.","∃C > 0 ∀x ∈ (0, 1): |f(x)| ≤ C.","lang"],
  [6,1,"Обязательно ли сумма двух неограниченных последовательностей неограниченна?","Нет: aₙ = n, bₙ = −n, сумма ≡ 0.","true"],
 ]},
 { id:"61", title:"Вариант 61 (2009, 12 баллов)", tasks:[
  [1,4,"Сформулируйте и докажите первую теорему Коши о промежуточных значениях F(t). Существенна ли непрерывность?","F ∈ C[a, b], F(a)F(b) < 0 ⇒ ∃c ∈ (a, b): F(c) = 0 (делением отрезка пополам). Непрерывность существенна: F = −1 при t < 0, F = 1 при t ≥ 0 на [−1; 1] нуля не имеет.","proof","97"],
  [2,3,"Докажите теорему о сумме б.м. функций при x → −∞, не используя теорему о пределе суммы.","|α| < {{ε//2}} при x < M₁, |β| < {{ε//2}} при x < M₂ ⇒ |α + β| < ε при x < min(M₁, M₂).","proof"],
  [3,1,"Обоснуйте (1 + x)ᵖ = 1 + px + o(x) и (1 + x)ᵖ − 1 ~ px при x → 0.","Из lim {{(1 + x)ᵖ − 1//x}} = p: {{(1 + x)ᵖ − 1 − px//x}} → 0, т.е. (1 + x)ᵖ = 1 + px + o(x); и {{(1 + x)ᵖ − 1//px}} → 1 (p ≠ 0).","o"],
  [4,2,"lim[x→a−0] f(x) = A + 0 на языках окрестностей и неравенств; пример.","∀ε > 0 ∃δ > 0 ∀x ∈ (a − δ; a): A < f(x) < A + ε. Пример: f(x) = A + (a − x).","lang"],
  [5,1,"В позитивной форме: последовательность неограниченна.","∀C > 0 ∃n: |aₙ| > C.","lang"],
  [6,1,"Может ли произведение функций с разрывом II рода в x₀ быть непрерывным?","Может: f = sin{{1//x}} + 2, g = {{1//f}}, f(0)g(0) = 1.","true"],
 ]},
 { id:"22", title:"Вариант 22 (2009, 12 баллов)", tasks:[
  [2,2,"Сформулируйте и докажите теорему о локальной ограниченности функции, имеющей предел (x → x₀ − 0).","lim[x→x₀−0] f = A ⇒ ∃δ: |f(x)| ≤ |A| + 1 на (x₀ − δ; x₀) — определение предела с ε = 1.","proof","35"],
  [3,2,"Выведите lim[x→0] {{eˣ − 1//x}}. Объясните предельный переход в сложной функции.","Замена t = eˣ − 1 → 0 (непрерывность экспоненты), x = ln(1 + t): {{eˣ − 1//x}} = {{t//ln(1 + t)}} → 1. Переход законен по теореме о пределе сложной функции (t ≠ 0 при x ≠ 0).","proof","46"],
  [5,1,"В позитивной форме: функция не ограничена на отрезке [1, 2].","∀C > 0 ∃x ∈ [1, 2]: |f(x)| > C.","lang"],
  [6,1,"Если f непрерывна в a, то 1/f непрерывна в a?","Неверно: f(x) = x, a = 0 — {{1//x}} в нуле не определена.","true"],
 ]},
 { id:"431", title:"Вариант 431", tasks:[
  [1,4,"Сформулируйте и докажите теорему о переходе к пределу в неравенстве. Обязано ли сохраняться строгое неравенство? Может ли?","aₙ ≤ bₙ (n ≥ N), aₙ → a, bₙ → b ⇒ a ≤ b (от противного, ε = {{a − b//2}}). Строгое не обязано: {{1//n}} > 0, но 0 = 0. Может: 1 + {{1//n}} > {{1//n}} и 1 > 0.","proof","22"],
  [4,2,"lim[x→−3+0] f(x) = +∞ на языках окрестностей и неравенств; пример.","∀E > 0 ∃δ > 0 ∀x ∈ (−3; −3 + δ): f(x) > E. Пример: f(x) = {{1//x + 3}}.","lang"],
  [6,2,"f = o(tg² x²) + o(x³) при x → 0. Можно ли записать f = o(x⁴)?","tg² x² ~ x⁴ = o(x³), поэтому гарантируется лишь f = o(x³). Представить в виде o(x⁴) в общем случае нельзя: внутреннее o(x³) может быть x^{3,5}, f = x^{3,8}.","o"],
  [7,4,"f(x) − f(2) = −3(x − 2) + o(x − 2), g(x) − g(2) = 2(x − 2) + o(1) при x → 2. Знак приращений при x → 2 − 0?","f(x) − f(2) = (x − 2)(−3 + o(1)); при x → 2 − 0 оба множителя отрицательны ⇒ f(x) > f(2) в некоторой левой полуокрестности (устойчивость знака для −3 + o(1)). Для g: 2(x − 2) + o(1) — знак определяет o(1), выяснить нельзя. «x → 2 − 0» означает x ∈ U⁻_{δ}(2) = (2 − δ; 2).","o"],
 ]},
];

/* ===================== Хранилище ===================== */
const useCloud = inTG && tg.CloudStorage && can("6.9");
const KEY = "zk", CHUNK = 4000;
const cloudGet = keys => new Promise((res, rej) => tg.CloudStorage.getItems(keys, (err, vals) => err ? rej(err) : res(vals || {})));
const cloudSet = (k, v) => new Promise((res, rej) => tg.CloudStorage.setItem(k, v, err => err ? rej(err) : res()));
const cloudRemove = keys => new Promise(res => keys.length ? tg.CloudStorage.removeItems(keys, () => res()) : res());
async function loadRaw() {
  if (!useCloud) { try { return localStorage.getItem(KEY) || ""; } catch(e) { return ""; } }
  const meta = await cloudGet([KEY + "_n"]); const n = parseInt(meta[KEY + "_n"] || "0", 10); if (!n) return "";
  const keys = Array.from({length:n}, (_, i) => KEY + "_" + i); const vals = await cloudGet(keys);
  return keys.map(k => vals[k] || "").join("");
}
let savedChunks = 0;
async function saveRaw(str) {
  if (!useCloud) { try { localStorage.setItem(KEY, str); } catch(e) {} return; }
  const parts = []; for (let i = 0; i < str.length; i += CHUNK) parts.push(str.slice(i, i + CHUNK));
  for (let i = 0; i < parts.length; i++) await cloudSet(KEY + "_" + i, parts[i]);
  await cloudSet(KEY + "_n", String(parts.length));
  const extra = []; for (let i = parts.length; i < savedChunks; i++) extra.push(KEY + "_" + i);
  await cloudRemove(extra); savedChunks = parts.length;
}
let loaded = false, saving = false, pending = false, saveTimer = null;
function save(now) { if (!loaded) return; clearTimeout(saveTimer); saveTimer = setTimeout(flush, now ? 0 : 400); }
async function flush() {
  if (saving) { pending = true; return; }
  saving = true;
  try { await saveRaw(JSON.stringify(state)); } catch(e) { toast("Не удалось сохранить — проверь интернет"); }
  saving = false; if (pending) { pending = false; flush(); }
}
document.addEventListener("visibilitychange", () => { if (document.hidden && loaded) { clearTimeout(saveTimer); flush(); } });

// card: {id, f, b, ex, due, iv, ef, reps, lapses}
let state = { v:1, onboarded:false, decks:[], exams:[], log:{}, settings:{ goal:20, newPerDay:10, autoSay:false, color:"#3b5bdb" }, newDone:{} };
const dayNum = d => Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 86400000);
const fromDay = n => { const d = new Date(n * 86400000); return new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()); };
const today = () => dayNum(new Date());
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const MONTHS_GEN = ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
const WD = ["Пн","Вт","Ср","Чт","Пт","Сб","Вс"];
const wdOf = n => (fromDay(n).getDay() + 6) % 7;
const fmtDay = d => { const x = fromDay(d); return `${x.getDate()} ${MONTHS_GEN[x.getMonth()]}`; };
function plural(n, a, b, c) { const x = Math.abs(n) % 100, y = x % 10; return (x > 10 && x < 20) ? c : y === 1 ? a : (y >= 2 && y <= 4) ? b : c; }
const COLORS = ["#3b5bdb","#5c7cfa","#7048e8","#ae3ec9","#e64980","#fa5252","#fd7e14","#f59f00","#82c91e","#12b886","#0ca678","#1098ad","#15aabf","#495057","#845ef7","#20c997"];
const EMOJIS = ["📈","✏️","🧮","📊","🇬🇧","🔁","∫","📚","🧠","💡","📝","🎯","💰","🏛️","🌍","⚖️","🔬","🧪","💻","📐","🗂️","📖","🇩🇪","🇫🇷","🇪🇸","🇨🇳","🎓","⭐","🔥","🚀","🧩","📜"];
const mkCard = (f, b, ex) => ({ id: uid(), f, b, ex: ex || "", due: 0, iv: 0, ef: 2.5, reps: 0, lapses: 0 });
function migrate(d) {
  const s = Object.assign({ v:1, onboarded:true, decks:[], exams:[], log:{}, newDone:{} }, d);
  s.settings = Object.assign({ goal:20, newPerDay:10, autoSay:false, color:"#3b5bdb" }, s.settings || {});
  s.decks = (s.decks || []).map(dk => Object.assign({ emoji:"📚", color:"#3b5bdb", cards:[], reverse:false }, dk));
  s.decks.forEach(dk => dk.cards = dk.cards.map(c => Object.assign({ ex:"", due:0, iv:0, ef:2.5, reps:0, lapses:0 }, c)));
  if (!Array.isArray(s.exams)) s.exams = [];
  if (!s.kr || typeof s.kr !== "object") s.kr = {};
  return s;
}
function addReady(r) {
  if (state.decks.some(d => d.ready === r.id)) return null;
  const d = { id: uid(), ready: r.id, name: r.name, emoji: r.emoji, color: r.color, lang: r.lang || "", subj: r.subj || "", reverse:false, created: today(),
              cards: r.cards.map(([f, b, ex]) => mkCard(f, b, ex)) };
  state.decks.push(d); return d;
}
const cState = c => c.reps === 0 ? "new" : c.iv >= 21 ? "done" : "learn";
const isDue = (c, t) => c.reps > 0 && c.due <= t;
function deckInfo(d) {
  const t = today(); let nw = 0, learn = 0, done = 0, due = 0;
  d.cards.forEach(c => { const s = cState(c); if (s === "new") nw++; else if (s === "done") done++; else learn++; if (isDue(c, t)) due++; });
  const newLeft = Math.max(0, state.settings.newPerDay - ((state.newDone[d.id] || {})[t] || 0));
  return { nw, learn, done, due, total: d.cards.length, newToday: Math.min(nw, newLeft), pct: d.cards.length ? Math.round(done / d.cards.length * 100) : 0,
           known: d.cards.length ? Math.round((done + learn * .5) / d.cards.length * 100) : 0 };
}
const toStudy = d => { const i = deckInfo(d); return i.due + i.newToday; };
const todayCount = () => state.log[today()] || 0;
function streakDays() {
  const t = today(); let n = 0;
  for (let d = t; ; d--) { if ((state.log[d] || 0) > 0) n++; else if (d !== t) break; if (t - d > 3650) break; }
  return n;
}
// Интервальное повторение (упрощённый SM-2). g: 0 — снова, 1 — трудно, 2 — хорошо, 3 — легко
function nextIv(c, g) {
  if (g === 0) return 0;
  if (c.reps === 0) return g === 1 ? 1 : g === 2 ? 1 : 3;
  if (c.reps === 1) return g === 1 ? 2 : g === 2 ? 3 : 6;
  const base = Math.max(1, c.iv);
  return g === 1 ? Math.max(base + 1, Math.round(base * 1.2)) : g === 2 ? Math.max(base + 1, Math.round(base * c.ef)) : Math.max(base + 2, Math.round(base * c.ef * 1.35));
}
function grade(c, g) {
  const iv = nextIv(c, g), t = today();
  if (g === 0) { c.lapses++; c.ef = Math.max(1.3, c.ef - .2); c.reps = 0; c.iv = 0; c.due = t; }

const langStmt = (xk, vk) => `${LV[vk].q} ${LX[xk].q}:  ${LV[vk].c}`;
